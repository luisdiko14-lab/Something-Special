<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Dash</title><link rel="stylesheet" href="style.css"></head>
<body><main class="game-shell"><header><div><span class="eyebrow">ARCADE // 02</span><h1>NEON DASH</h1></div><div class="score-box">SCORE<strong id="score">0</strong></div></header>

<canvas id="game" width="900" height="520" aria-label="Neon Dash game"></canvas>
<div class="controls"><div><button id="start">START RUN</button><button id="pause">PAUSE</button></div><span>Move: <b>WASD / ARROWS</b> · Collect ◆ · Grab power-ups · <b>P</b> pause</span></div></main><script src="game.js"></script></body></html>
